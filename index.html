<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <link rel='stylesheet' href='style.css'>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/maple-mono@5.2.6/index.css" />
        <title>Profolio Editor</title>
    </head>
    <body>

        <div class="app">

            <!-- ============ TOP BAR ============ -->
            <header class="topbar">
                <div class="topbar__left">
                    <div class="brand">
                        <span class="brand__mark">P</span>
                        <span class="brand__name">Profolio</span>
                    </div>
                    <div class="topbar__divider"></div>
                    <button class="project-name" type="button">
                        <span>Untitled Portfolio</span>
                        <svg viewBox="0 0 24 24" class="icon icon--sm"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                </div>

                <div class="topbar__center">
                    <div class="device-switch">
                        <button class="device-switch__btn is-active" type="button" data-device="desktop" title="Desktop">
                            <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
                        </button>
                        <button class="device-switch__btn" type="button" data-device="tablet" title="Tablet">
                            <svg viewBox="0 0 24 24" class="icon"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M12 18.5h.01"/></svg>
                        </button>
                        <button class="device-switch__btn" type="button" data-device="mobile" title="Mobile">
                            <svg viewBox="0 0 24 24" class="icon"><rect x="7.5" y="2.5" width="9" height="19" rx="2"/><path d="M12 18h.01"/></svg>
                        </button>
                    </div>
                </div>

                <div class="topbar__right">
                    <button class="icon-btn" type="button" title="Undo">
                        <svg viewBox="0 0 24 24" class="icon"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1"/></svg>
                    </button>
                    <button class="icon-btn" type="button" title="Redo">
                        <svg viewBox="0 0 24 24" class="icon"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h1"/></svg>
                    </button>
                    <div class="topbar__divider"></div>
                    <button class="btn btn--ghost" type="button">Preview</button>
                    <button class="btn btn--primary" type="button">Publish</button>
                    <div class="avatar">JD</div>
                </div>
            </header>

            <div class="workspace">

                <!-- ============ LEFT TOOLBAR ============ -->
                <aside class="toolbar">
                    <nav class="toolbar__group">
                        <button class="tool is-active" type="button" data-tool="select" title="Select">
                            <svg viewBox="0 0 24 24" class="icon"><path d="M4 3l6.5 17 2.5-7 7-2.5L4 3z"/></svg>
                            <span class="tool__label">Select</span>
                        </button>
                        <button class="tool" type="button" data-tool="text" title="Text">
                            <svg viewBox="0 0 24 24" class="icon"><path d="M5 5h14M12 5v14"/></svg>
                            <span class="tool__label">Text</span>
                        </button>
                        <button class="tool" type="button" data-tool="image" title="Image">
                            <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5.5-5.5L4 21"/></svg>
                            <span class="tool__label">Image</span>
                        </button>
                        <button class="tool" type="button" data-tool="section" title="Section">
                            <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></svg>
                            <span class="tool__label">Section</span>
                        </button>
                        <button class="tool" type="button" data-tool="shape" title="Shapes">
                            <svg viewBox="0 0 24 24" class="icon"><circle cx="9" cy="9" r="5"/><rect x="12" y="12" width="9" height="9" rx="1.5"/></svg>
                            <span class="tool__label">Shapes</span>
                        </button>
                        <button class="tool" type="button" data-tool="embed" title="Embed">
                            <svg viewBox="0 0 24 24" class="icon"><path d="M9 8 5 12l4 4M15 8l4 4-4 4M13 6l-2 12"/></svg>
                            <span class="tool__label">Embed</span>
                        </button>
                    </nav>

                    <div class="toolbar__spacer"></div>

                    <nav class="toolbar__group">
                        <button class="tool" type="button" data-tool="layers" title="Layers">
                            <svg viewBox="0 0 24 24" class="icon"><path d="M12 3 2 9l10 6 10-6-10-6z"/><path d="M2 15l10 6 10-6M2 12l10 6 10-6"/></svg>
                            <span class="tool__label">Layers</span>
                        </button>
                        <button class="tool" type="button" data-tool="settings" title="Settings">
                            <svg viewBox="0 0 24 24" class="icon"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
                            <span class="tool__label">Settings</span>
                        </button>
                    </nav>
                </aside>

                <!-- ============ CENTER CANVAS ============ -->
                <main class="canvas-area">
                    <div class="canvas-toolbar">
                        <div class="canvas-toolbar__group canvas-toolbar__zoom">
                            <button class="icon-btn icon-btn--sm" type="button" title="Zoom out">
                                <svg viewBox="0 0 24 24" class="icon"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg>
                            </button>
                            <span class="zoom-value">100%</span>
                            <button class="icon-btn icon-btn--sm" type="button" title="Zoom in">
                                <svg viewBox="0 0 24 24" class="icon"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="canvas-scroll">
                        <div class="canvas-frame" data-frame="desktop"><!-- populated by renderer.js: renderPageIntoCanvas() --></div>
                    </div>
                </main>

                <!-- ============ RIGHT PANEL ============ -->
                <aside class="panel">
                    <div class="panel__tabs">
                        <button class="panel__tab is-active" type="button" data-panel="layouts">
                            <svg viewBox="0 0 24 24" class="icon icon--sm"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                            Layouts
                        </button>
                        <button class="panel__tab" type="button" data-panel="themes">
                            <svg viewBox="0 0 24 24" class="icon icon--sm"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z"/></svg>
                            Themes
                        </button>
                        <button class="panel__tab" type="button" data-panel="assets">
                            <svg viewBox="0 0 24 24" class="icon icon--sm"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="9" r="1.7"/><path d="M21 16l-5-5-9 9"/></svg>
                            Assets
                        </button>
                        <button class="panel__tab" type="button" data-panel="settings">
                            <svg viewBox="0 0 24 24" class="icon icon--sm"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
                            Settings
                        </button>
                    </div>

                    <div class="panel__content">

                        <!-- LAYOUTS -->
                        <div class="panel__pane is-active" data-pane="layouts">
                            <p class="panel__hint">Expand a page, then start from a layout.</p>
                            <div class="page-accordion" id="pageAccordion"><!-- populated automatically from /layout --></div>
                        </div>

                        <!-- THEMES -->
                        <div class="panel__pane" data-pane="themes">
                            <p class="panel__hint">Pick a color and type theme for your site.</p>
                            <div class="theme-list">
                                <button class="theme-card is-active">
                                    <div class="theme-card__swatches">
                                        <span style="background:#111114"></span>
                                        <span style="background:#6366f1"></span>
                                        <span style="background:#f4f4f5"></span>
                                    </div>
                                    <span>Ink &amp; Violet</span>
                                </button>
                                <button class="theme-card">
                                    <div class="theme-card__swatches">
                                        <span style="background:#1c1917"></span>
                                        <span style="background:#f97316"></span>
                                        <span style="background:#fafaf9"></span>
                                    </div>
                                    <span>Ember</span>
                                </button>
                                <button class="theme-card">
                                    <div class="theme-card__swatches">
                                        <span style="background:#0f172a"></span>
                                        <span style="background:#22d3ee"></span>
                                        <span style="background:#f8fafc"></span>
                                    </div>
                                    <span>Cyan Night</span>
                                </button>
                                <button class="theme-card">
                                    <div class="theme-card__swatches">
                                        <span style="background:#f5f5f4"></span>
                                        <span style="background:#16a34a"></span>
                                        <span style="background:#ffffff"></span>
                                    </div>
                                    <span>Sage Light</span>
                                </button>
                            </div>

                            <p class="panel__hint panel__hint--tight">Typography</p>
                            <div class="font-list">
                                <button class="font-card is-active">
                                    <span class="font-card__preview" style="font-family: 'Maple Mono', monospace;">Aa</span>
                                    <span>Maple Mono</span>
                                </button>
                                <button class="font-card">
                                    <span class="font-card__preview" style="font-family: Georgia, serif;">Aa</span>
                                    <span>Editorial Serif</span>
                                </button>
                                <button class="font-card">
                                    <span class="font-card__preview" style="font-family: Arial, sans-serif;">Aa</span>
                                    <span>Neutral Sans</span>
                                </button>
                            </div>
                        </div>

                        <!-- ASSETS -->
                        <div class="panel__pane" data-pane="assets">
                            <p class="panel__hint">Images, icons and files for your site.</p>
                            <div class="asset-upload">
                                <svg viewBox="0 0 24 24" class="icon"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>
                                <span>Drop files or click to upload</span>
                            </div>
                            <div class="asset-grid">
                                <div class="asset-thumb"></div>
                                <div class="asset-thumb"></div>
                                <div class="asset-thumb"></div>
                                <div class="asset-thumb"></div>
                                <div class="asset-thumb"></div>
                                <div class="asset-thumb"></div>
                            </div>
                        </div>

                        <!-- SETTINGS -->
                        <div class="panel__pane" data-pane="settings">
                            <p class="panel__hint">Site-wide settings.</p>
                            <div class="field">
                                <label>Site title</label>
                                <div class="field__input">Jordan Doe — Portfolio</div>
                            </div>
                            <div class="field">
                                <label>Domain</label>
                                <div class="field__input">jordandoe.profolio.site</div>
                            </div>
                            <div class="field">
                                <label>Favicon</label>
                                <div class="field__input field__input--row">
                                    <div class="favicon-preview"></div>
                                    <span>Upload icon</span>
                                </div>
                            </div>
                        </div>

                    </div>
                </aside>

            </div>
        </div>

        <script src='renderer.js'></script>
        <script src='script.js'></script>
    </body>
</html>
